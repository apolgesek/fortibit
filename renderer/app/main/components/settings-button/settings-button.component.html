@if (notifications$ | async; as notifications) {
	<div
		appDropdown
		class="settings dropdown"
		[ngClass]="{ new: notifications.length }"
	>
		<button
			appDropdownToggle
			trigger="click"
			appMenuItem
			class="icon-btn"
			type="button"
			appTooltip="Settings"
			container="body"
		>
			<span class="sr-only">Settings</span>
			@if (notifications.length) {
				<div class="badge" [ngClass]="getNotificationTypeColor(notifications)">
					<span class="sr-only">{{ notifications.length }} notifications</span>
				</div>
			}
			<i-feather name="settings"></i-feather>
		</button>
		<ul *appDropdownMenu class="dropdown-content right" @slideDown>
			@if (updateAvailable) {
				<li appMenuItem (activate)="openAboutWindow()" class="update-btn">
					Update is available <span class="version">{{ updateAvailable }}</span>
				</li>
			}
			@if (!updateAvailable) {
				<li appMenuItem [disabled]="true">No updates available</li>
			}
			<li appMenuItem (activate)="openSettings()">{{ settingsLabel }}</li>
		</ul>
	</div>
}
