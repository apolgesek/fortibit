@if (model?.length) {
	<div
		data-prevent-entry-deselect
		class="context-menu"
		data-testid="context-menu"
	>
		<ul
			class="items-list"
			appFocusableList
			role="menu"
			[selected]="selected"
			(focused)="setFocus($event.item)"
			[focusOnLoad]="true"
		>
			@for (item of model; track item) {
				@if (!item.separator) {
					<li
						[appFocusableListItem]="item"
						role="menuitem"
						tabindex="0"
						[ngClass]="{
							separator: item.separator,
							disabled: item['_disabled'],
						}"
						(click)="
							!item['_disabled'] &&
								item.command &&
								executeCommand(item.command, $event)
						"
						(keyup.enter)="
							!item['_disabled'] &&
								item.command &&
								executeCommand(item.command, $event)
						"
						(mouseenter)="setFocus(item)"
					>
						{{ item.label }} <span class="secondary">{{ item.hotkey }}</span>
					</li>
				} @else {
					<div class="divider"><hr /></div>
				}
				<ng-template #separator>
					<div class="divider"><hr /></div>
				</ng-template>
			}
		</ul>
	</div>
}
