@if (tabs.length) {
	<ul>
		@for (tab of tabs; track tab) {
			<li>
				<button
					#headerButton
					type="button"
					[attr.disabled]="tab.disabled"
					[ngClass]="{ active: activeTab === tab }"
					class="secondary-btn"
					(click)="setTab(tab)"
				>
					{{ tab.header }}
				</button>
			</li>
		}
	</ul>
}

<div class="template-container">
	<ng-content></ng-content>
</div>
