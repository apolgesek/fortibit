<app-modal bodyClass="settings-modal">
	<div class="dialog-header">
		<h2>Settings</h2>
		<a
			href="#"
			role="button"
			aria-label="Close"
			class="close-dialog"
			(click)="close(); (false)"
			>&times;
		</a>
	</div>
	<div class="dialog-message">
		<app-tabset>
			<app-tab header="General" #generalTab>
				@if (generalTab.active) {
					<app-general-tab></app-general-tab>
				}
			</app-tab>
			<app-tab header="Encryption" #encryptionTab>
				@if (encryptionTab.active) {
					<app-encryption-tab></app-encryption-tab>
				}
			</app-tab>
			<app-tab header="View" #viewTab>
				@if (viewTab.active) {
					<app-view-tab></app-view-tab>
				}
			</app-tab>
			@if (shouldIncludeTab(tab.Integration)) {
				<app-tab header="Integration" #integrationTab>
					@if (integrationTab.active) {
						<app-integration-tab></app-integration-tab>
					}
				</app-tab>
			}
			@if (shouldIncludeTab(tab.Organization)) {
				<app-tab header="Organization" #organizationTab>
					@if (organizationTab.active) {
						<app-organization-tab></app-organization-tab>
					}
				</app-tab>
			}
		</app-tabset>
	</div>
</app-modal>
