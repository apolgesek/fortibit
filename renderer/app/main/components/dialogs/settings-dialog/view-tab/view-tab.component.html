<div class="container">
	<form [formGroup]="viewForm">
		<app-toggle-input
			formControlName="darkTheme"
			label="Dark theme"
		></app-toggle-input>
		<div class="info-box">
			<i-feather name="info"></i-feather>
			Icons for web login entries are provided by fortibit's trusted content
			server.
		</div>
		<app-toggle-input
			formControlName="displayIcons"
			label="Display entry icons"
		></app-toggle-input>
	</form>
</div>
