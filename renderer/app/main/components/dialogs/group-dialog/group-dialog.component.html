<app-modal>
	<div class="dialog-header">
		<h2>{{ title }}</h2>
		<a
			href="#"
			role="button"
			aria-label="Close"
			class="close-dialog"
			(click)="close(); (false)"
			>&times;
		</a>
	</div>
	<div class="dialog-message">
		<div [formGroup]="groupForm">
			<div class="inputgroup">
				<span class="inputgroup-addon"
					><i-feather name="bookmark"></i-feather
				></span>
				<input
					type="text"
					aria-describedby="name-invalid"
					[attr.aria-invalid]="isControlInvalid(name)"
					id="group-name"
					#autofocus
					formControlName="name"
					placeholder="Name"
				/>
			</div>
			@if (isControlInvalid(name)) {
				<div class="validation-error" id="name-invalid">
					@if (name.hasError('required')) {
						Group name is required.
					}
					@if (name.hasError('maxlength')) {
						Group name must not exceed 40 characters.
					}
				</div>
			}
		</div>
	</div>
	<div class="footer-container">
		<button
			type="button"
			class="text-btn"
			(click)="close()"
			(keyup.enter)="close()"
		>
			Cancel
		</button>
		@if (additionalData?.payload?.mode === 'edit') {
			<button
				type="button"
				id="remove-group"
				class="primary-btn"
				(click)="removeGroup()"
				(keyup.enter)="removeGroup()"
			>
				Remove
			</button>
		}
		<button
			type="button"
			id="save-group"
			class="primary-btn"
			(click)="saveGroup()"
			(keyup.enter)="saveGroup()"
		>
			Save
		</button>
	</div>
</app-modal>
